services:

  database:
    image: mysql:8.0
    container_name: urgence360-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: urgence360
      MYSQL_USER: urgence360
      MYSQL_PASSWORD: urgence360
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ./urgence360-api
      dockerfile: Dockerfile
    container_name: urgence360-api
    restart: always
    depends_on:
      - database
    ports:
      - "8000:80"
    environment:
      APP_ENV: prod
      DATABASE_URL: "mysql://urgence360:urgence360@database:3306/urgence360?serverVersion=8.0"

  front:
    build:
      context: ./urgence360-front
      dockerfile: Dockerfile
    container_name: urgence360-front
    restart: always
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8001/api
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    
volumes:
  db_data: